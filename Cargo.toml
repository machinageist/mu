[package]
name = "mu"
version = "0.2.0"
edition = "2024"
description = "mu, the markup/markdown utility: a fast terminal presenter for Markdown, other markup and data formats"
license = "MIT"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
unicode-width = "0.2"
libc = "0.2"
png = "0.18.1"
gif = "0.14.2"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
resvg = { version = "0.49.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
